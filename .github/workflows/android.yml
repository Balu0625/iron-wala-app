name: Build Android APK

on:
  push:
    branches: [main, minicpm-chat]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Install JS dependencies (also fetches llama.rn native libs)
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/MiniCPM-Chat-v1.0.${{ github.run_number }}.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-Chat-apk
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: minicpm-chat-v1.0.${{ github.run_number }}
          name: MiniCPM Chat v1.0.${{ github.run_number }}
          body: |
            Offline MiniCPM5 chat for Android (arm64).
            Download the APK below on your phone and install it.
          files: dist/*.apk
          make_latest: false
